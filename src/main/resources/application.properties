spring.application.name=vehicle-information-system
server.port=8080
server.address=0.0.0.0

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.root=INFO
logging.level.com.example.vehicleinformation=INFO

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Profiles:
#   dev  → application-dev.properties (SQL Server, local)
#   prod → application-prod.properties (PostgreSQL Supabase, server)
# Activate at runtime: --spring.profiles.active=dev|prod
spring.profiles.active=dev
