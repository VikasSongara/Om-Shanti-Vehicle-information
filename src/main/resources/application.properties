spring.application.name=vehicle-information-system
server.port=8080

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

logging.level.root=INFO
logging.level.com.example.vehicleinformation=INFO

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Admin credentials:
#   local/dev  → defaults in application-dev.properties (admin / admin123)
#   production → must come from ADMIN_USERNAME / ADMIN_PASSWORD env vars
# Password is BCrypt-encoded at startup unless already a BCrypt hash ($2a$ / $2b$ / $2y$).

# local = SQL Server (application-dev.properties)
# production = PostgreSQL Supabase (application-prod.properties)
spring.profiles.active=dev
