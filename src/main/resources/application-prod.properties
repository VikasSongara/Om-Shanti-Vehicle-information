# Production profile: PostgreSQL (Supabase) on Render
server.port=${PORT:8080}
spring.thymeleaf.cache=true
logging.level.com.example.vehicleinformation=INFO
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=WARN

# Required on Render — set ADMIN_USERNAME and ADMIN_PASSWORD as environment variables
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# Hide internals from clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Useful when running behind nginx / reverse proxy / Render
server.forward-headers-strategy=framework

# Session cookie hardening (Render uses HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# REQUIRED: use Supabase Session pooler (IPv4). Direct db.*.supabase.co often hangs on Render (IPv6).
# Example:
#   jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
# Username is often: postgres.<project-ref>  (Session mode)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Fail fast if DB is unreachable (avoid Render "no open ports" timeout)
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
