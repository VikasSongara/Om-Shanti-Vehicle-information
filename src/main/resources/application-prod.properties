# Production profile: PostgreSQL (Supabase)
server.port=${PORT:8080}
spring.thymeleaf.cache=true
logging.level.com.example.vehicleinformation=INFO
logging.level.root=WARN

# Required on Render — set ADMIN_USERNAME and ADMIN_PASSWORD as environment variables
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

# Hide internals from clients
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Useful when running behind nginx / reverse proxy / Render
server.forward-headers-strategy=framework

# Session cookie hardening (Render uses HTTPS)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}

# Prefer SPRING_DATASOURCE_URL (Supabase Session pooler). Direct db.* often fails on Render (IPv6).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:db.tqdduurvsqqnfqqdgfbx.supabase.co}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
