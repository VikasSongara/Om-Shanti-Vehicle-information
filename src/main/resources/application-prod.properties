# Production profile: PostgreSQL (Supabase Session pooler)
# Run: java -jar vehicle-information-system.jar --spring.profiles.active=prod

server.port=8080
spring.thymeleaf.cache=true
logging.level.com.example.vehicleinformation=INFO
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=WARN

app.admin.username=admin
app.admin.password=admin123

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

server.forward-headers-strategy=framework

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Supabase Session pooler (host/port/name — password separate, not in URL)
spring.datasource.url=jdbc:postgresql://aws-0-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require
spring.datasource.username=postgres.tqdduurvsqqnfqqdgfbx
spring.datasource.password=Omvehical@123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
