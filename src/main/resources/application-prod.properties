# Production profile: PostgreSQL (Supabase Session pooler)
# Run: java -jar vehicle-information-system.jar --spring.profiles.active=prod

server.port=8080
spring.thymeleaf.cache=true
logging.level.com.example.vehicleinformation=INFO
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=WARN

app.admin.username=admin
app.admin.password=admin123

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

server.forward-headers-strategy=framework

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# Supabase Session pooler.
# Prefer Render vars: DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
# (ProdDatasourceEnvPostProcessor builds the JDBC URL from them.)
# Optional overrides: SPRING_DATASOURCE_URL / USERNAME / PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
