# Local profile: SQL Server
spring.thymeleaf.cache=false
logging.level.com.example.vehicleinformation=DEBUG
logging.level.org.springframework.security=INFO
spring.jpa.show-sql=true

# Local/dev admin login (override with ADMIN_USERNAME / ADMIN_PASSWORD if needed)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://192.168.100.55:1440;databaseName=vs_Test;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USER:PTDev}
spring.datasource.password=${DB_PASSWORD:PTDev}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
