<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head(${formTitle})}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-4" th:text="${formTitle}">Vehicle Form</h1>

                    <form th:action="@{${formAction}}" th:object="${vehicleForm}" method="post" novalidate>
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">
                            <label class="form-label" for="vehicleType">Vehicle Type</label>
                            <input type="text" class="form-control" id="vehicleType" th:field="*{vehicleType}" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('vehicleType')}" th:errors="*{vehicleType}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="vehicleNumber">Vehicle Number</label>
                            <input type="text" class="form-control text-uppercase" id="vehicleNumber" th:field="*{vehicleNumber}" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('vehicleNumber')}" th:errors="*{vehicleNumber}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="blockNo">Block No</label>
                                <select class="form-select" id="blockNo" th:field="*{blockNo}" required>
                                    <option value="">Select Block</option>
                                    <option th:each="block : ${blockOptions}"
                                            th:value="${block}"
                                            th:text="${block}">A</option>
                                </select>
                                <div class="text-danger small" th:if="${#fields.hasErrors('blockNo')}" th:errors="*{blockNo}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="houseNo">House No</label>
                                <input type="text" class="form-control" id="houseNo" th:field="*{houseNo}" required/>
                                <div class="text-danger small" th:if="${#fields.hasErrors('houseNo')}" th:errors="*{houseNo}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="name">Name</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="mobileNumber">Mobile Number</label>
                            <input type="text" class="form-control" id="mobileNumber" th:field="*{mobileNumber}" maxlength="10" required/>
                            <div class="text-danger small" th:if="${#fields.hasErrors('mobileNumber')}" th:errors="*{mobileNumber}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Save
                            </button>
                            <a th:href="@{/vehicles}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
