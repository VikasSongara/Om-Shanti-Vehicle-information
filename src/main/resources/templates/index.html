<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Om Shanti - gold plus - 2')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 flex-grow-1">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="row align-items-center">
        <div class="col-lg-7">
            <h1 class="display-5 fw-bold mb-1" style="color:#0b1f3a;">Om Shanti</h1>
            <h3 class="h5 text-muted fw-normal mb-3">gold plus - 2</h3>
            <p class="lead text-muted mb-4">
                Search and view registered vehicles.
                Administrators can manage records and import data from Excel.
            </p>
            <div class="d-flex gap-2 flex-wrap">
                <a th:href="@{/vehicles}" class="btn btn-primary btn-lg">
                    <i class="bi bi-search me-2"></i>Browse Vehicles
                </a>

                <a th:href="@{/admin/dashboard}" class="btn btn-outline-primary btn-lg" sec:authorize="hasRole('ADMIN')">
                    <i class="bi bi-speedometer2 me-2"></i>Dashboard
                </a>
            </div>
        </div>
        <div class="col-lg-5 mt-4 mt-lg-0">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 text-center">
                    <div class="brand-om brand-om-hero" aria-hidden="true">ૐ</div>
                    <h3 class="mt-3" th:text="${totalVehicles} + ' Vehicles'">0 Vehicles</h3>
                    <p class="text-muted mb-0">Total registered in the system</p>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
