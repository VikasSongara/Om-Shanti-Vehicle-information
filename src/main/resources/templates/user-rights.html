<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('User Rights')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-2"><i class="bi bi-shield-lock me-2"></i>User Rights</h1>
                    <p class="text-muted mb-4">
                        Control whether guests (without login) can see and use
                        <strong>Edit</strong> / <strong>Delete</strong> on the Vehicle List after search.
                        Admin always has full access.
                    </p>

                    <form th:action="@{/admin/user-rights}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" role="switch"
                                   id="allowEdit" name="allowEdit" value="true"
                                   th:checked="${allowEdit}"/>
                            <label class="form-check-label" for="allowEdit">
                                Allow <strong>Edit</strong> link for User (guest)
                            </label>
                        </div>

                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" role="switch"
                                   id="allowDelete" name="allowDelete" value="true"
                                   th:checked="${allowDelete}"/>
                            <label class="form-check-label" for="allowDelete">
                                Allow <strong>Delete</strong> button for User (guest)
                            </label>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-save me-1"></i>Save Rights
                            </button>
                            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
