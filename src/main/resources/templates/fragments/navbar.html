<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg app-navbar">
    <div class="container">
        <div class="navbar-mobile-bar">
            <a class="navbar-brand d-flex align-items-center gap-2 py-1 mb-0" th:href="@{/}" aria-label="Om Shanti gold plus - 2">
                <span class="brand-om" aria-hidden="true">ૐ</span>
                <span class="brand-text">
                    <span class="brand-title">Om Shanti</span>
                    <span class="brand-subtitle">Gold Plus - 2</span>
                </span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                    aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav app-nav-links ms-lg-auto align-items-lg-center">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vehicles}">Vehicles</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vehicles/add}">Add Vehicle</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/vehicles/deleted}">Deleted</a>
                </li>
                <li class="nav-item nav-item-excel" sec:authorize="hasRole('ADMIN')">
                    <button type="button" class="nav-link nav-excel-toggle" id="excelNav"
                            aria-expanded="false" aria-controls="excelSubmenu">
                        <span class="nav-excel-label">
                            <i class="bi bi-file-earmark-spreadsheet" aria-hidden="true"></i>
                            <span>Excel</span>
                        </span>
                        <span class="nav-excel-caret" aria-hidden="true"></span>
                    </button>
                    <div class="app-excel-submenu" id="excelSubmenu" hidden>
                        <ul class="app-excel-menu list-unstyled mb-0">
                            <li>
                                <a class="nav-excel-link" th:href="@{/vehicles/import}">
                                    <i class="bi bi-upload" aria-hidden="true"></i>
                                    <span>Import</span>
                                </a>
                            </li>
                            <li>
                                <a class="nav-excel-link" th:href="@{/vehicles/export}">
                                    <i class="bi bi-download" aria-hidden="true"></i>
                                    <span>Export</span>
                                </a>
                            </li>
                            <li>
                                <a class="nav-excel-link" th:href="@{/vehicles/import/demo}">
                                    <i class="bi bi-file-earmark-arrow-down" aria-hidden="true"></i>
                                    <span>Download Demo Excel</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </li>
                <li class="nav-item nav-item-login" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-nav-login" th:href="@{/login}">Admin Login</a>
                </li>
                <li class="nav-item nav-item-login" sec:authorize="hasRole('ADMIN')">
                    <form th:action="@{/logout}" method="post" class="nav-logout-form">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-nav-login">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
