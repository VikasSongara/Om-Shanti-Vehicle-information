<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/header :: head('Deleted Vehicles')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
        <div>
            <h1 class="h3 mb-1"><i class="bi bi-trash me-2"></i>Deleted Vehicles</h1>
            <p class="text-muted mb-0">Soft-deleted records (status = 0). Rollback restores them to Vehicles.</p>
        </div>
        <a th:href="@{/vehicles}" class="btn btn-outline-primary">Back to Vehicles</a>
    </div>

    <div class="table-responsive card shadow-sm border-0">
        <table class="table table-hover mb-0 align-middle">
            <thead class="table-light">
            <tr>
                <th>Vehicle Type</th>
                <th>Vehicle Number</th>
                <th>Block No</th>
                <th>House No</th>
                <th>Name</th>
                <th>Mobile Number</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(deletedVehicles)}">
                <td colspan="7" class="text-center text-muted py-4">No deleted vehicles found.</td>
            </tr>
            <tr th:each="v : ${deletedVehicles}">
                <td th:text="${v.vehicleType}">car</td>
                <td><span class="badge bg-secondary" th:text="${v.vehicleNumber}">GJ01</span></td>
                <td th:text="${v.blockNo}">F</td>
                <td th:text="${v.houseNo}">101</td>
                <td th:text="${v.name}">User</td>
                <td th:text="${v.mobileNumber}">9876543210</td>
                <td class="text-end text-nowrap">
                    <form th:action="@{/vehicles/rollback/{id}(id=${v.id})}" method="post" class="d-inline">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-success">Rollback</button>
                    </form>
                    <form th:action="@{/vehicles/permanent-delete/{id}(id=${v.id})}" method="post"
                          class="d-inline delete-form"
                          data-confirm="Permanently delete this vehicle? This cannot be undone.">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
