<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Error')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-5 flex-grow-1 text-center">
    <i class="bi bi-exclamation-octagon display-1 text-danger"></i>
    <h1 class="h3 mt-3">Something went wrong</h1>
    <p class="text-muted" th:text="${errorMessage} ?: 'An unexpected error occurred.'"></p>
    <a th:href="@{/}" class="btn btn-primary mt-3">Go Home</a>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
