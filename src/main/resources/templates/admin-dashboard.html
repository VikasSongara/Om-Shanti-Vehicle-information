<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Admin Dashboard')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <h1 class="h3 mb-4"><i class="bi bi-speedometer2 me-2"></i>Admin Dashboard</h1>

    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-xl-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <div class="text-muted small">Total Vehicles</div>
                    <h2 class="mt-2" th:text="${stats.totalVehicles}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <div class="text-muted small">Total Cars</div>
                    <h2 class="mt-2" th:text="${stats.totalCars}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <div class="text-muted small">Total Bikes</div>
                    <h2 class="mt-2" th:text="${stats.totalBikes}">0</h2>
                </div>
            </div>
        </div>
        <div class="col-sm-6 col-xl-3">
            <div class="card shadow-sm border-0 h-100">
                <div class="card-body text-center p-4">
                    <div class="text-muted small">Total Active Records</div>
                    <h2 class="mt-2" th:text="${stats.totalActiveRecords}">0</h2>
                </div>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0 mb-4">
        <div class="card-body p-4">
            <h2 class="h5 mb-3">Quick Actions</h2>
            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/vehicles}" class="btn btn-primary">View Vehicles</a>
                <a th:href="@{/vehicles/add}" class="btn btn-primary">Add Vehicle</a>
                <a th:href="@{/vehicles/deleted}" class="btn btn-outline-danger">Deleted</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-outline-secondary">Logout</button>
                </form>
            </div>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-4">
            <h2 class="h5 mb-2"><i class="bi bi-file-earmark-spreadsheet me-2"></i>Excel</h2>
            <p class="text-muted small mb-3">Import, export, or download a demo template for vehicle data.</p>
            <div class="d-flex flex-wrap gap-2">
                <a th:href="@{/vehicles/import}" class="btn btn-success">
                    <i class="bi bi-upload me-1"></i>Import
                </a>
                <a th:href="@{/vehicles/export}" class="btn btn-outline-success">
                    <i class="bi bi-download me-1"></i>Export
                </a>
                <a th:href="@{/vehicles/import/demo}" class="btn btn-outline-primary">
                    <i class="bi bi-file-earmark-arrow-down me-1"></i>Download Demo Excel
                </a>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
