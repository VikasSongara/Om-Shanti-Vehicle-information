<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Scheduler')}"></head>
<body class="d-flex flex-column min-vh-100 app-body">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4 flex-grow-1">
    <div th:replace="~{fragments/messages :: messages}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h1 class="h4 mb-2"><i class="bi bi-clock-history me-2"></i>Scheduler</h1>
                    <p class="text-muted mb-4">
                        Automatically runs every set minutes (default <strong>14</strong>):
                        <br/>1) search a random vehicle number
                        <br/>2) search a random house no
                    </p>

                    <form th:action="@{/admin/scheduler}" method="post" class="mb-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label class="form-label" for="intervalMinutes">Interval (minutes)</label>
                            <input type="number" class="form-control" id="intervalMinutes" name="intervalMinutes"
                                   th:value="${intervalMinutes}" min="1" max="1440" required/>
                            <div class="form-text">Allowed range: 1–1440 minutes. Default is 14.</div>
                        </div>

                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="enabled" name="enabled" value="true"
                                   th:checked="${enabled}"/>
                            <label class="form-check-label" for="enabled">Enable scheduler</label>
                        </div>

                        <div class="d-flex flex-wrap gap-2">
                            <button type="submit" class="btn btn-primary">Save</button>
                            <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary">Back</a>
                        </div>
                    </form>

                    <form th:action="@{/admin/scheduler/run-now}" method="post" class="mb-4">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        <button type="submit" class="btn btn-outline-primary">
                            <i class="bi bi-play-fill me-1"></i>Run once now
                        </button>
                    </form>

                    <div class="border rounded-3 p-3 bg-light">
                        <h2 class="h6 mb-3">Last run</h2>
                        <dl class="row mb-0 small">
                            <dt class="col-sm-4">Time</dt>
                            <dd class="col-sm-8" th:text="${lastRunAt}">—</dd>
                            <dt class="col-sm-4">Summary</dt>
                            <dd class="col-sm-8" th:text="${lastRunSummary}">Not run yet</dd>
                            <dt class="col-sm-4" th:if="${lastError != null}">Error</dt>
                            <dd class="col-sm-8 text-danger" th:if="${lastError != null}" th:text="${lastError}"></dd>
                        </dl>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
